<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Destilación al Vacío - Clase 2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #050a0c; color: #d1e1f2; font-family: 'Times New Roman', Times, serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; transition: filter 1s ease; }
        body.gas-active { filter: blur(12px); }
        .interface-container { background-color: #0b1318; border: 2px solid #233d4d; box-shadow: 0 0 20px rgba(35, 61, 77, 0.5); border-radius: 8px; width: 100%; max-width: 700px; padding: 25px; text-align: center; position: relative; }
        h1 { color: #ffffff; font-size: 22pt; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; border-bottom: 1px solid #233d4d; padding-bottom: 10px; }
        .sub-header { font-style: italic; color: #8da5b3; font-size: 11pt; margin-bottom: 15px; }
        .stats-bar { background-color: #04090c; border: 1px solid #172a35; padding: 8px; border-radius: 4px; font-size: 10.5pt; margin-bottom: 20px; color: #5dade2; font-weight: bold; }
        .destilador-display { width: 140px; height: 180px; background: linear-gradient(135deg, #1c2d37, #070d12); border: 4px solid #7f8c8d; border-radius: 30px 30px 15px 15px; margin: 20px auto; position: relative; box-shadow: inset 0 0 25px #000, 0 0 15px rgba(127, 140, 141, 0.3); }
        .vacuum-seal { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 35px; height: 35px; background-color: #2c3e50; border: 3px solid #7f8c8d; border-radius: 50%; font-family: monospace; font-size: 7.5pt; line-height: 29px; color: #e74c3c; font-weight: bold; }
        .vacuum-seal.sealed { color: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .liquid { position: absolute; left: 12px; right: 12px; bottom: 15px; top: 140px; background-color: transparent; border-radius: 10px 10px 8px 8px; transition: all 0.8s ease; }
        .liquid.lagrimas { top: 70px; background-color: #a9cce3; box-shadow: inset 0 0 15px #5499c7, 0 0 10px rgba(169, 204, 227, 0.5); }
        .liquid.tamiz { top: 65px; background-color: #ccd1d1; box-shadow: inset 0 0 15px #7f8c8d; }
        .liquid.plateado { top: 60px; background-color: #eaeded; box-shadow: inset 0 0 25px #ffffff, 0 0 20px rgba(255, 255, 255, 0.8); }
        .liquid.vaporizado { top: 20px; background-color: #7b7d7d !important; box-shadow: 0 0 35px #95a5a6 !important; }
        .fire-burner { width: 70px; height: 12px; background-color: #444; margin: 0 auto; border-radius: 3px; transition: background-color 0.3s; }
        .fire-burner.on { background-color: #d35400; box-shadow: 0 4px 12px #d35400; }
        .console-box { background-color: #030608; border: 1px solid #172a35; font-family: monospace; padding: 15px; text-align: left; border-radius: 4px; height: 110px; overflow-y: auto; margin-bottom: 25px; color: #5dade2; font-size: 10pt; }
        .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        button { background-color: #0b1a24; border: 1px solid #172a35; color: #d5f5e3; padding: 12px; font-family: 'Times New Roman', Times, serif; font-size: 11pt; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #172a35; color: #ffffff; }
        button:disabled { background-color: #050b0f; border-color: #0d171e; color: #34495e; cursor: not-allowed; }
        .btn-action { background-color: #641e16; border-color: #7b241c; color: #ffffff; }
        .btn-pdf { background-color: #7d6608; border-color: #9a7d0a; color: #ffffff; }
        #pdf-template { display: none; background-color: #0b1319; color: #e5e8e8; padding: 35px; border: 5px double #34495e; width: 620px; margin: 0 auto; }
    </style>
</head>
<body>

    <div class="interface-container" id="lab-interface">
        <h1>Mesa de Destilación al Vacío</h1>
        <div class="sub-header">Cátedra del Profesor Jeremías Snape • Certificación Oficial</div>

        <div class="stats-bar" id="stats-display">🔮 HISTORIAL DEL OPERARIO: Intento Actual N° 1</div>

        <div class="destilador-display" id="destilador">
            <div class="vacuum-seal" id="manometro">OFF</div>
            <div class="liquid" id="pocion-liquido"></div>
        </div>
        <div class="fire-burner" id="quemador"></div>

        <div class="console-box" id="consola">[SISTEMA]: Contenedor purgado. Esperando matriz base...</div>

        <div class="controls-grid">
            <button id="btn-lagrimas" onclick="inyectarLagrimas()">Inyectar 3 Lágrimas</button>
            <button id="btn-vacio" onclick="activarBombaVacio()">Activar Bomba Vacío</button>
            <button id="btn-fuego" onclick="alternarFuego()">Encender Calor Sutil</button>
            <button id="btn-tamiz" onclick="filtrarBezoar()">Filtrar por Tamiz</button>
            <button id="btn-ruda" class="btn-action" onclick="inyectarRuda()">Inyectar Ruda</button>
            <button id="btn-descargar" class="btn-pdf" onclick="descargarPDFClase2()" disabled>Descargar Certificado</button>
            <button id="btn-reiniciar" onclick="reiniciarMesa()" style="grid-column: span 2;">Limpiar Mesa (Reiniciar)</button>
        </div>
    </div>

    <script>
        let tieneLagrimas = false, vacioActivo = false, fuegoEncendido = false, filtradoHecho = false, operacionTerminada = false, numeroIntentos = 1;

        function actualizarConsola(texto) {
            const consola = document.getElementById("consola");
            consola.innerHTML += "<br>" + texto;
            consola.scrollTop = consola.scrollHeight;
        }

        function inyectarLagrimas() {
            if (operacionTerminada || tieneLagrimas) return;
            tieneLagrimas = true;
            document.getElementById("pocion-liquido").className = "liquid lagrimas";
            actualizarConsola("[MATRIZ]: Lágrimas inyectadas.");
        }

        function activarBombaVacio() {
            if (operacionTerminada || vacioActivo) return;
            vacioActivo = true;
            const manometro = document.getElementById("manometro");
            manometro.innerText = "ON";
            manometro.classList.add("sealed");
            actualizarConsola("[VACÍO]: Bomba activa.");
        }

        function alternarFuego() {
            if (operacionTerminada) return;
            fuegoEncendido = !fuegoEncendido;
            document.getElementById("quemador").classList.toggle("on");
            actualizarConsola(fuegoEncendido ? "[TÉRMICO]: Calor activo." : "[TÉRMICO]: Calor apagado.");
        }

        function filtrarBezoar() {
            if (operacionTerminada || !tieneLagrimas || !vacioActivo || !fuegoEncendido) {
                actualizarConsola("[FALLO]: Requisitos de filtrado no cumplidos.");
                return;
            }
            filtradoHecho = true;
            document.getElementById("pocion-liquido").className = "liquid tamiz";
            actualizarConsola("[TAMIZ]: Fluido filtrado.");
        }

        function inyectarRuda() {
            if (operacionTerminada || !filtradoHecho) return;
            operacionTerminada = true;
            const liquido = document.getElementById("pocion-liquido");
            
            if (fuegoEncendido) {
                liquido.className = "liquid vaporizado";
                actualizarConsola("[🚨 CATASTROFE]: ¡CHOQUE TÉRMICO!");
                document.body.classList.add("gas-active");
            } else {
                liquido.className = "liquid plateado";
                actualizarConsola("[🏆 EXCELENCIA]: Destilado puro.");
            }
            document.getElementById("btn-descargar").disabled = false;
        }

        function reiniciarMesa() {
            numeroIntentos++;
            document.getElementById("stats-display").innerText = `🔮 HISTORIAL DEL OPERARIO: Intento Actual N° ${numeroIntentos}`;
            tieneLagrimas = vacioActivo = fuegoEncendido = filtradoHecho = operacionTerminada = false;
            
            document.getElementById("pocion-liquido").className = "liquid";
            document.getElementById("quemador").classList.remove("on");
            const manometro = document.getElementById("manometro");
            manometro.innerText = "OFF";
            manometro.classList.remove("sealed");
            
            document.getElementById("consola").innerHTML = "[SISTEMA]: Mesa limpiada.";
            document.body.classList.remove("gas-active");
            document.getElementById("btn-descargar").disabled = true;
        }

        function descargarPDFClase2() {
            alert("Certificado generado. Recuerda: la precisión es ley.");
        }
    </script>
</body>
</html>
